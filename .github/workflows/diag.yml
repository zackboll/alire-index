# Disposable diagnostics for alire-project/alire-index#2230 macOS failures.
# Run 3: on the CLT 27 image, compare the unmodified upstream
# alire-index-checks gh-build-crate.sh with the proposed SDKROOT patch, for
# stable and development alr, each attempt from a clean Alire state.
# Replicas exit immediately on older images. Not for upstream submission.
name: Diag macOS CLT 27 GNAT link

on:
  push:
    branches: [diag/macos-clt27-gnat-link]
  workflow_dispatch:

jobs:
  newimage:
    name: replica ${{ matrix.replica }}
    runs-on: macos-latest
    timeout-minutes: 150
    strategy:
      fail-fast: false
      matrix:
        replica: [1, 2, 3, 4, 5, 6]
    steps:
      - name: Classify runner image
        id: img
        run: |
          clt=$(pkgutil --pkg-info=com.apple.pkg.CLTools_Executables | sed -n 's/^version: //p')
          echo "ImageOS=$ImageOS ImageVersion=$ImageVersion CLT=$clt"
          case "$clt" in
            27.*) echo "new=true" >> "$GITHUB_OUTPUT" ;;
            *) echo "new=false" >> "$GITHUB_OUTPUT"
               echo "::notice::replica ${{ matrix.replica }}: CLT $clt on $ImageVersion is not the CLT 27 image; nothing to test" ;;
          esac

      - name: Check out alire-index PR 2230 merge ref (as upstream CI)
        if: steps.img.outputs.new == 'true'
        uses: actions/checkout@v4
        with:
          repository: alire-project/alire-index
          ref: refs/pull/2230/merge
          fetch-depth: 0
      - name: Check out upstream alire-index-checks stable-1.4.0
        if: steps.img.outputs.new == 'true'
        uses: actions/checkout@v4
        with:
          repository: alire-project/alire-index-checks
          ref: stable-1.4.0
          path: checks-upstream
      - name: Check out patched alire-index-checks
        if: steps.img.outputs.new == 'true'
        uses: actions/checkout@v4
        with:
          repository: zackboll/alire-index-checks
          ref: fix/macos-sdkroot-consistency
          path: checks-patched
      - name: Check out diagnostics
        if: steps.img.outputs.new == 'true'
        uses: actions/checkout@v4
        with:
          path: diagsrc

      - name: Set up stable alr
        if: steps.img.outputs.new == 'true'
        uses: alire-project/setup-alire@latest
        with:
          version: 2.1.1
      - name: stable upstream
        id: stable_upstream
        if: steps.img.outputs.new == 'true'
        continue-on-error: true
        run: bash diagsrc/diag/exact2.sh upstream stable
      - name: stable patched
        id: stable_patched
        if: steps.img.outputs.new == 'true'
        continue-on-error: true
        run: bash diagsrc/diag/exact2.sh patched stable

      - name: Set up devel alr
        if: steps.img.outputs.new == 'true'
        uses: alire-project/setup-alire@latest
        with:
          branch: master
      - name: dev upstream
        id: dev_upstream
        if: steps.img.outputs.new == 'true'
        continue-on-error: true
        run: bash diagsrc/diag/exact2.sh upstream dev
      - name: dev patched
        id: dev_patched
        if: steps.img.outputs.new == 'true'
        continue-on-error: true
        run: bash diagsrc/diag/exact2.sh patched dev

      - name: Verdict
        if: steps.img.outputs.new == 'true'
        run: |
          echo "stable upstream=${{ steps.stable_upstream.outcome }} patched=${{ steps.stable_patched.outcome }}"
          echo "dev    upstream=${{ steps.dev_upstream.outcome }} patched=${{ steps.dev_patched.outcome }}"
          cat "$RUNNER_TEMP"/exact-*.summary
          # Expected: unmodified checks reproduce the failure; the patch passes.
          [ "${{ steps.stable_upstream.outcome }}" = failure ] &&
          [ "${{ steps.stable_patched.outcome }}" = success ] &&
          [ "${{ steps.dev_upstream.outcome }}" = failure ] &&
          [ "${{ steps.dev_patched.outcome }}" = success ]
